# Sveltia CMS configuration
#
# Before first use, replace the placeholder below:
#   base_url -> your deployed sveltia-cms-auth Worker URL

backend:
  name: github
  repo: tajdidalam/study-notes
  branch: main
  base_url: https://sveltia-cms-auth.YOUR_SUBDOMAIN.workers.dev

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: subjects
    label: Subjects
    label_singular: Subject
    folder: src/content/subjects
    create: true
    slug: '{{slug}}'
    summary: '{{title}}'
    sortable_fields: [order, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: string }
      - { name: order, label: Order, widget: number, value_type: int, default: 0, hint: 'Subjects are listed from lowest to highest order.' }
      - { name: body, label: Body, widget: markdown, required: false }

  - name: posts
    label: Blog Posts
    label_singular: Post
    folder: src/content/posts
    create: true
    slug: '{{slug}}'
    summary: '{{title}} ({{subject}})'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: subject
        label: Subject
        widget: relation
        collection: subjects
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
      - { name: date, label: Date, widget: datetime, format: 'YYYY-MM-DD', time_format: false }
      - { name: description, label: Description, widget: string, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: 'Drafts are hidden from the published site.' }
      - { name: body, label: Body, widget: markdown, hint: 'Use $...$ for inline math and $$...$$ for block equations.' }

  - name: notes
    label: Notes
    label_singular: Note
    folder: src/content/notes
    create: true
    slug: '{{slug}}'
    summary: '{{title}} ({{subject}} / {{section}})'
    sortable_fields: [subject, section, order]
    fields:
      - { name: title, label: Title, widget: string }
      - name: subject
        label: Subject
        widget: relation
        collection: subjects
        value_field: '{{slug}}'
        search_fields: [title]
        display_fields: [title]
      - { name: section, label: Section, widget: string, default: General, hint: 'Sidebar group, e.g. "Mechanics" or "Calculus".' }
      - { name: order, label: Order, widget: number, value_type: int, default: 0, hint: 'Position within the section, lowest first.' }
      - { name: description, label: Description, widget: string, required: false }
      - { name: body, label: Body, widget: markdown, hint: 'Use ## headings for sections (they appear in the table of contents). Use $...$ for inline math and $$...$$ for block equations.' }
